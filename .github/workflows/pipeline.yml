name: Pipeline API REST

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice
      uses: actions/checkout@v4

    - name: Configura Docker Build
      uses: docker/setup-buildx-action@v3

    - name: Compila Immagine Docker di Test
      run: |
        docker build -t mia-api-geometria:latest .